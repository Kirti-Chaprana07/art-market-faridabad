services:
  - type: web
    name: art-market-faridabad
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn artmarket.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
