{% extends 'base.html' %}

{% block title %}Owner Login | {{ STORE_NAME }}{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-16">
    <div class="max-w-md w-full bg-white rounded-3xl border border-stone-200 shadow-xl p-8 space-y-6 text-center">
        
        <div class="w-16 h-16 rounded-2xl bg-stone-900 text-white flex items-center justify-center mx-auto text-2xl shadow-md">
            <i class="fas fa-user-shield text-emerald-400"></i>
        </div>

        <div>
            <h1 class="font-cinzel text-2xl font-bold text-stone-900">Owner Portal Access</h1>
            <p class="text-xs text-stone-500 mt-1">Art Market Faridabad Store Management</p>
        </div>

        <form method="POST" action="{% url 'owner_login' %}" class="space-y-4 text-left">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Enter Owner Security PIN</label>
                <div class="relative">
                    <input type="password" name="pin" required autofocus placeholder="Enter 4-digit PIN (Default: 9899)" class="w-full p-3.5 bg-stone-50 border border-stone-200 rounded-xl text-center text-lg font-bold tracking-widest focus:ring-2 focus:ring-stone-900 focus:outline-none">
                </div>
                <span class="text-[11px] text-stone-400 mt-1.5 block text-center">Default PIN: <strong class="text-stone-700 font-mono">9899</strong> (or 1234)</span>
            </div>

            <button type="submit" class="w-full py-3.5 bg-stone-900 hover:bg-stone-800 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-md transition-all">
                Unlock Owner Dashboard &rarr;
            </button>
        </form>

        <div class="pt-2 text-xs text-stone-400">
            <a href="{% url 'home' %}" class="hover:text-stone-900">&larr; Return to Public Website</a>
        </div>

    </div>
</div>
{% endblock %}
